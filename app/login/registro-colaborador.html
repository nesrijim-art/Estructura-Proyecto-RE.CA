<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aceptar Invitación · RE.CA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa; --surface: #ffffff;
      --fg: #0d1117; --fg-2: #374151; --muted: #6b7280;
      --border: #e5e7eb; --border-soft: #f3f4f6;
      --accent: #ffd21e; --accent-on: #0d1117; --accent-hover: #f59e0b;
      --success: #16a34a; --danger: #dc2626;
      --font-display: "IBM Plex Mono", ui-monospace, monospace;
      --font-body: "Source Sans Pro", system-ui, sans-serif;
      --radius-md: 6px; --radius-lg: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font-body); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 440px; }
    .brand { font-family: var(--font-display); font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 8px; }
    .invite-info { background: #fff4cc; border: 1px solid #fcd34d; border-radius: var(--radius-md); padding: 16px; margin-bottom: 24px; font-size: 14px; }
    .invite-info strong { font-family: var(--font-display); display: block; margin-bottom: 4px; }
    h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-family: var(--font-display); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 15px; outline: none; transition: border-color 120ms; }
    input:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 11px 16px; border-radius: var(--radius-md); font-family: var(--font-display); font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: background 120ms; margin-top: 8px; }
    .btn-primary { background: var(--fg); color: #fff; }
    .btn-primary:hover { background: var(--fg-2); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .alert { padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; margin-bottom: 16px; display: none; }
    .alert-error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
    .alert-success { background: #dcfce7; border: 1px solid #86efac; color: #14532d; }
    .loading { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0; }
    .expired { text-align: center; padding: 40px 0; }
    .expired p { color: var(--muted); font-size: 15px; margin-top: 8px; }
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-family: var(--font-display); font-size: 12px; font-weight: 500; }
    .badge-admin { background: #dbeafe; color: #1e40af; }
    .badge-editor { background: #dcfce7; color: #166534; }
    .badge-visualizador { background: #f3f4f6; color: #374151; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">RE.CA</div>

  <div id="loading" class="loading">Verificando invitación…</div>
  <div id="expired" class="expired" style="display:none">
    <div style="font-size:48px">⚠️</div>
    <h2 id="expiredTitle">Enlace no válido</h2>
    <p id="expiredMsg">Este enlace de invitación no es válido o ha expirado.</p>
  </div>
  <div id="formWrap" style="display:none">
    <div class="invite-info" id="inviteInfo"></div>
    <h2>Crea tu cuenta</h2>
    <div class="alert alert-error" id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>
    <form id="form">
      <div class="form-group">
        <label for="nombre">Tu nombre completo</label>
        <input type="text" id="nombre" placeholder="Ej. María López" required minlength="3" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="passwordConfirm">Confirmar contraseña</label>
        <input type="password" id="passwordConfirm" placeholder="Repite tu contraseña" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Crear cuenta</button>
    </form>
  </div>
  <div id="successWrap" style="display:none; text-align:center; padding: 24px 0;">
    <div style="font-size:48px">✅</div>
    <h2 style="margin:16px 0 8px">¡Cuenta creada!</h2>
    <p style="color:var(--muted); margin-bottom:24px">Ya puedes iniciar sesión con tu correo y contraseña.</p>
    <a href="/app/login/" class="btn btn-primary" style="display:inline-block; text-decoration:none; padding:11px 24px; color:#fff;">Ir al inicio de sesión</a>
  </div>
</div>

<script type="module">
  import { api } from '/shared/js/api.js';

  const token = new URLSearchParams(location.search).get('token');

  const $loading     = document.getElementById('loading');
  const $expired     = document.getElementById('expired');
  const $expiredTitle = document.getElementById('expiredTitle');
  const $expiredMsg  = document.getElementById('expiredMsg');
  const $formWrap    = document.getElementById('formWrap');
  const $inviteInfo  = document.getElementById('inviteInfo');
  const $form        = document.getElementById('form');
  const $alertError  = document.getElementById('alertError');
  const $alertSuccess = document.getElementById('alertSuccess');
  const $submitBtn   = document.getElementById('submitBtn');
  const $successWrap = document.getElementById('successWrap');

  function showError(msg) {
    $alertError.textContent = msg;
    $alertError.style.display = 'block';
    $alertSuccess.style.display = 'none';
  }

  function roleLabel(rol) {
    const map = { admin: 'Admin', editor: 'Editor', visualizador: 'Visualizador' };
    const cls  = { admin: 'badge-admin', editor: 'badge-editor', visualizador: 'badge-visualizador' };
    return `<span class="badge ${cls[rol] || ''}">${map[rol] || rol}</span>`;
  }

  async function init() {
    if (!token) {
      $loading.style.display = 'none';
      $expiredTitle.textContent = 'Enlace inválido';
      $expiredMsg.textContent = 'No se proporcionó un token de invitación.';
      $expired.style.display = 'block';
      return;
    }
    try {
      const data = await api.usuarios.validarToken(token);
      $loading.style.display = 'none';
      $inviteInfo.innerHTML = `
        <strong>${data.empresa_nombre}</strong>
        Te invitaron como ${roleLabel(data.rol)} a este negocio.
        ${data.contacto ? `<br><span style="color:var(--muted);font-size:12px">${data.contacto}</span>` : ''}
      `;
      $formWrap.style.display = 'block';
    } catch (err) {
      $loading.style.display = 'none';
      if (err.status === 410) {
        $expiredTitle.textContent = 'Enlace expirado o ya utilizado';
        $expiredMsg.textContent = err.message;
      } else if (err.status === 404) {
        $expiredTitle.textContent = 'Enlace no encontrado';
        $expiredMsg.textContent = 'Este enlace de invitación no existe.';
      } else {
        $expiredTitle.textContent = 'Error';
        $expiredMsg.textContent = 'Ocurrió un error al verificar la invitación.';
      }
      $expired.style.display = 'block';
    }
  }

  $form.addEventListener('submit', async e => {
    e.preventDefault();
    $alertError.style.display = 'none';
    const nombre   = document.getElementById('nombre').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('passwordConfirm').value;

    if (password !== confirm) return showError('Las contraseñas no coinciden.');
    if (password.length < 8)  return showError('La contraseña debe tener al menos 8 caracteres.');

    $submitBtn.disabled = true;
    $submitBtn.textContent = 'Creando cuenta…';
    try {
      await api.usuarios.registroColaborador({ token, nombre, password });
      $formWrap.style.display = 'none';
      $successWrap.style.display = 'block';
    } catch (err) {
      showError(err.message || 'Error al crear la cuenta.');
    } finally {
      $submitBtn.disabled = false;
      $submitBtn.textContent = 'Crear cuenta';
    }
  });

  init();
</script>
</body>
</html>
