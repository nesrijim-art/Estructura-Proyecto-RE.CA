<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nueva Contraseña · RE.CA</title>
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+Pro:wght@400;600&display=swap" />
<link rel="stylesheet" href="/shared/css/design-tokens.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); line-height: 1.6; }
  .container { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 48px 40px; box-shadow: var(--shadow-md); }
  .page-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--fg); text-align: center; margin-bottom: 8px; }
  .page-desc { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 32px; }
  .form { display: flex; flex-direction: column; gap: var(--space-4); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-family: var(--font-display); font-size: 12px; font-weight: 500; color: var(--fg); letter-spacing: .02em; }
  .input-wrap { position: relative; }
  .field input { width: 100%; height: 48px; padding: 0 48px 0 var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 15px; font-family: var(--font-body); color: var(--fg); background: var(--surface); transition: border-color var(--transition); }
  .field input:focus { outline: none; border-color: var(--fg); box-shadow: 0 0 0 3px rgba(13,17,23,.1); }
  .field.has-error input { border-color: var(--danger); }
  .error-msg { font-size: 12px; color: var(--danger); display: none; }
  .field.has-error .error-msg { display: block; }
  .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; display: flex; align-items: center; transition: color var(--transition); }
  .toggle-password:hover { color: var(--fg); }
  .toggle-password svg { width: 20px; height: 20px; }
  .btn-primary { width: 100%; height: 52px; background: var(--fg); color: var(--surface); border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; font-family: var(--font-display); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: var(--space-2); transition: background-color var(--transition); }
  .btn-primary:hover:not(:disabled) { background: var(--fg-2); }
  .btn-primary:disabled { background: var(--muted); cursor: not-allowed; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .message { padding: var(--space-3); border-radius: var(--radius-sm); font-size: 14px; display: none; align-items: center; gap: var(--space-2); }
  .message.show { display: flex; }
  .message.success { background: color-mix(in oklab,var(--success),transparent 90%); color: var(--success); border: 1px solid color-mix(in oklab,var(--success),transparent 70%); }
  .message.error { background: color-mix(in oklab,var(--danger),transparent 90%); color: var(--danger); border: 1px solid color-mix(in oklab,var(--danger),transparent 70%); }
  .invalid-token { text-align: center; }
  .invalid-token p { color: var(--muted); margin-bottom: 24px; }
  .btn-link { display: inline-flex; align-items: center; gap: 6px; background: var(--fg); color: var(--surface); padding: 12px 24px; border-radius: var(--radius-md); font-family: var(--font-display); font-size: 14px; font-weight: 600; text-decoration: none; }
  @media (max-width: 480px) { .container { padding: 32px 24px; } }
</style>
</head>
<body>

<div class="container">
  <div id="invalidState" class="invalid-token" style="display:none">
    <h1 class="page-title" style="margin-bottom:16px">Enlace inválido</h1>
    <p>Este enlace de recuperación es inválido o ha expirado. Los enlaces tienen validez de 1 hora.</p>
    <a href="recuperar.html" class="btn-link">Solicitar nuevo enlace</a>
  </div>

  <div id="formState">
    <h1 class="page-title">Nueva Contraseña</h1>
    <p class="page-desc">Ingresa y confirma tu nueva contraseña.</p>

    <div id="messageArea"></div>

    <form class="form" id="resetForm" novalidate>
      <div class="field" id="passwordField">
        <label for="password">NUEVA CONTRASEÑA</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required />
          <button type="button" class="toggle-password" aria-label="Mostrar contraseña" data-target="password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="error-msg">La contraseña debe tener al menos 8 caracteres</span>
      </div>

      <div class="field" id="confirmField">
        <label for="confirm">CONFIRMAR CONTRASEÑA</label>
        <div class="input-wrap">
          <input type="password" id="confirm" placeholder="Repite la contraseña" autocomplete="new-password" required />
          <button type="button" class="toggle-password" aria-label="Mostrar contraseña" data-target="confirm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="error-msg">Las contraseñas no coinciden</span>
      </div>

      <button type="submit" class="btn-primary" id="submitButton">
        <span id="buttonText">Guardar nueva contraseña</span>
      </button>
    </form>
  </div>
</div>

<script type="module">
import { api } from '/shared/js/api.js';

// Extract token from URL
const params = new URLSearchParams(window.location.search);
const token  = params.get('token');

if (!token) {
  document.getElementById('formState').style.display = 'none';
  document.getElementById('invalidState').style.display = 'block';
}

document.querySelectorAll('.toggle-password').forEach(btn => {
  btn.addEventListener('click', function() {
    const inp = document.getElementById(this.dataset.target);
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });
});

function showMessage(text, type) {
  const icon = type === 'success'
    ? '<path d="M20 6L9 17l-5-5"/>'
    : '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>';
  document.getElementById('messageArea').innerHTML =
    `<div class="message ${type} show"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${icon}</svg><span>${text}</span></div>`;
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  document.getElementById('passwordField').classList.remove('has-error');
  document.getElementById('confirmField').classList.remove('has-error');

  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  let valid = true;

  if (!password || password.length < 8) {
    document.getElementById('passwordField').classList.add('has-error'); valid = false;
  }
  if (password !== confirm) {
    document.getElementById('confirmField').classList.add('has-error'); valid = false;
  }
  if (!valid) return;

  const btn = document.getElementById('submitButton');
  btn.disabled = true;
  document.getElementById('buttonText').innerHTML = '<div class="spinner"></div><span>Guardando...</span>';

  try {
    const data = await api.auth.resetPassword({ token, password });
    showMessage(data.message + ' Redirigiendo...', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  } catch (err) {
    btn.disabled = false;
    document.getElementById('buttonText').textContent = 'Guardar nueva contraseña';
    if (err.status === 400) {
      document.getElementById('formState').style.display = 'none';
      document.getElementById('invalidState').style.display = 'block';
    } else {
      showMessage(err.message || 'Error al guardar la contraseña', 'error');
    }
  }
});
</script>
</body>
</html>
