<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentación de Módulos — SaaS Menús Digitales</title>
<style>
:root{
  --bg:#0d1117;--s:#161b22;--s2:#21262d;--bd:#30363d;
  --fg:#e6edf3;--mu:#8b949e;
  --blue:#58a6ff;--green:#3fb950;--orange:#f0883e;
  --purple:#bc8cff;--red:#ff7b72;--yellow:#e3b341;--gray:#8b949e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;overflow:hidden}

/* HEADER */
#hd{position:fixed;top:0;left:0;right:0;height:48px;background:var(--s);
  border-bottom:1px solid var(--bd);display:flex;align-items:center;
  padding:0 16px;gap:12px;z-index:200}
#hd h1{font-size:12px;font-weight:600;white-space:nowrap}
.sep{width:1px;height:20px;background:var(--bd)}
.badge{font-size:10px;font-family:ui-monospace,monospace;color:var(--green);
  border:1px solid rgba(63,185,80,.35);padding:2px 8px;border-radius:100px}
#search-wrap{flex:1;max-width:280px;position:relative}
#search{width:100%;background:var(--s2);border:1px solid var(--bd);
  border-radius:6px;padding:5px 10px 5px 30px;font-size:12px;color:var(--fg);
  font-family:inherit;outline:none}
#search:focus{border-color:var(--blue)}
#search::placeholder{color:var(--mu)}
#search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--mu);pointer-events:none}
.count-badge{margin-left:auto;font-size:11px;font-family:ui-monospace,monospace;color:var(--mu)}
#mod-count{color:var(--fg)}

/* LAYOUT */
#layout{display:flex;height:calc(100vh - 48px);margin-top:48px}

/* SIDEBAR */
#sb{width:250px;flex-shrink:0;border-right:1px solid var(--bd);
  overflow-y:auto;background:var(--s)}
#sb::-webkit-scrollbar{width:4px}
#sb::-webkit-scrollbar-track{background:transparent}
#sb::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}

.layer-group{border-bottom:1px solid var(--bd)}
.layer-header{padding:10px 12px 6px;font-size:9px;font-family:ui-monospace,monospace;
  text-transform:uppercase;letter-spacing:.12em;display:flex;align-items:center;gap:6px}
.layer-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mod-item{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 16px;
  cursor:pointer;transition:background .1s;font-size:12px;color:var(--mu);
  border-left:2px solid transparent}
.mod-item:hover{background:var(--s2);color:var(--fg)}
.mod-item.active{background:var(--s2);color:var(--fg);border-left-color:var(--blue)}
.mod-item .mi-name{font-weight:500}
.mod-item .mi-sub{font-size:10px;font-family:ui-monospace,monospace;opacity:.5;margin-left:auto;white-space:nowrap}
.mod-item.hidden{display:none}

/* MAIN CONTENT */
#main{flex:1;overflow-y:auto;padding:28px 32px}
#main::-webkit-scrollbar{width:6px}
#main::-webkit-scrollbar-track{background:transparent}
#main::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}

/* EMPTY STATE */
#empty{display:none;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--mu);gap:12px;text-align:center}
#empty.show{display:flex}
#empty .e-icon{font-size:32px;opacity:.3}
#empty .e-title{font-size:14px;font-weight:600;color:var(--fg)}
#empty .e-sub{font-size:12px}

/* MODULE HEADER */
#mod-header{margin-bottom:28px}
.mod-breadcrumb{font-size:10px;font-family:ui-monospace,monospace;color:var(--mu);
  margin-bottom:10px;display:flex;align-items:center;gap:6px}
.mod-breadcrumb .bc-layer{padding:2px 7px;border-radius:3px;font-size:9px;
  text-transform:uppercase;letter-spacing:.08em}
.mod-title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.mod-sub-label{font-size:12px;font-family:ui-monospace,monospace;color:var(--mu);
  display:flex;align-items:center;gap:8px}
.mod-id{opacity:.5}

/* SECTION GRID */
.sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.sec-full{margin-bottom:16px}

/* SECTION CARD */
.sec{background:var(--s);border:1px solid var(--bd);border-radius:10px;padding:18px}
.sec-label{font-size:9px;font-family:ui-monospace,monospace;text-transform:uppercase;
  letter-spacing:.12em;color:var(--mu);margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px solid var(--bd)}
.sec-text{font-size:13px;line-height:1.75;color:var(--fg)}
.tag-list{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;font-family:ui-monospace,monospace;padding:4px 9px;
  border-radius:4px;background:var(--s2);color:var(--mu);border:1px solid var(--bd);
  line-height:1.4}
.tag.mod-ref{cursor:pointer;transition:all .12s}
.tag.mod-ref:hover{color:var(--blue);border-color:rgba(88,166,255,.4)}
.item-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.item-list li{font-size:12px;color:var(--fg);padding:7px 10px;
  background:var(--s2);border:1px solid var(--bd);border-radius:6px;
  display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.item-list li::before{content:'▸';font-size:9px;color:var(--mu);flex-shrink:0;margin-top:3px}

/* USE CASES */
.uc-list{display:flex;flex-direction:column;gap:10px}
.uc{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:12px 14px}
.uc-title{font-size:12px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.uc-num{width:20px;height:20px;border-radius:50%;background:var(--s);
  font-size:10px;font-family:ui-monospace,monospace;display:grid;place-items:center;
  flex-shrink:0;border:1px solid var(--bd)}
.uc-desc{font-size:12px;color:var(--mu);line-height:1.65;padding-left:28px}

/* FLOW */
.flow-list{display:flex;flex-direction:column;gap:0}
.flow-step{display:flex;gap:12px;position:relative}
.flow-step:not(:last-child)::before{content:'';position:absolute;left:15px;
  top:32px;bottom:-4px;width:1px;background:var(--bd)}
.flow-num{width:30px;height:30px;border-radius:50%;background:var(--s2);
  border:1px solid var(--bd);font-size:11px;font-family:ui-monospace,monospace;
  display:grid;place-items:center;flex-shrink:0}
.flow-content{padding:5px 0 16px;font-size:12px;color:var(--fg);line-height:1.65}

/* WELCOME */
#welcome{display:none;flex-direction:column;align-items:center;justify-content:center;
  height:100%;text-align:center;gap:16px}
#welcome.show{display:flex}
#welcome .w-icon{font-size:40px;opacity:.15}
#welcome .w-title{font-size:18px;font-weight:700;color:var(--fg)}
#welcome .w-sub{font-size:13px;color:var(--mu);max-width:360px;line-height:1.6}
.w-stats{display:flex;gap:24px;margin-top:8px}
.w-stat{text-align:center}
.w-stat .ws-n{font-size:24px;font-weight:700;font-family:ui-monospace,monospace}
.w-stat .ws-l{font-size:11px;color:var(--mu)}
</style>
</head>
<body>

<header id="hd">
  <h1>SaaS Menús Digitales — Documentación de Módulos</h1>
  <div class="sep"></div>
  <span class="badge">31 módulos</span>
  <div id="search-wrap">
    <span id="search-icon">⌕</span>
    <input id="search" type="text" placeholder="Buscar módulo..." autocomplete="off">
  </div>
  <span class="count-badge"><span id="mod-count">31</span> / 31</span>
</header>

<div id="layout">
  <nav id="sb" id="sidebar"></nav>
  <main id="main">
    <div id="welcome" class="show">
      <div class="w-icon">⬡</div>
      <div class="w-title">Documentación Funcional Completa</div>
      <div class="w-sub">Selecciona un módulo del panel izquierdo para ver su documentación detallada.</div>
      <div class="w-stats">
        <div class="w-stat"><div class="ws-n" style="color:var(--blue)">5</div><div class="ws-l">Presentación</div></div>
        <div class="w-stat"><div class="ws-n" style="color:var(--purple)">3</div><div class="ws-l">Gateway</div></div>
        <div class="w-stat"><div class="ws-n" style="color:var(--green)">6</div><div class="ws-l">Núcleo</div></div>
        <div class="w-stat"><div class="ws-n" style="color:var(--orange)">6</div><div class="ws-l">Negocio</div></div>
        <div class="w-stat"><div class="ws-n" style="color:var(--red)">6</div><div class="ws-l">Datos</div></div>
        <div class="w-stat"><div class="ws-n" style="color:var(--gray)">5</div><div class="ws-l">Infra</div></div>
      </div>
    </div>
    <div id="mod-view" style="display:none">
      <div id="mod-header"></div>
      <div id="mod-body"></div>
    </div>
    <div id="empty"><div class="e-icon">⊘</div><div class="e-title">Sin resultados</div><div class="e-sub">Intenta con otro término de búsqueda.</div></div>
  </main>
</div>

<script>
const LAYERS = {
  presentation:{label:'Presentación',color:'var(--blue)',hex:'#58a6ff'},
  gateway:{label:'Gateway',color:'var(--purple)',hex:'#bc8cff'},
  core:{label:'Núcleo',color:'var(--green)',hex:'#3fb950'},
  business:{label:'Negocio',color:'var(--orange)',hex:'#f0883e'},
  data:{label:'Datos',color:'var(--red)',hex:'#ff7b72'},
  infra:{label:'Infraestructura',color:'var(--gray)',hex:'#8b949e'},
};

const MODS = [
  // ── PRESENTATION ───────────────────────────────────────────────────────────
  {id:'menu-viewer',name:'Menu Viewer',sub:'Customer PWA',layer:'presentation',
   objetivo:'Proveer al cliente final una interfaz web progresiva (PWA) para visualizar y navegar el menú digital del negocio, accesible via QR o URL directa, sin instalación de app nativa.',
   funcion:'Renderiza el árbol de categorías y productos del tenant activo, gestiona el carrito de compra en sesión, envía pedidos al Order Engine y refleja el tema visual configurado por el negocio.',
   administra:['Sesión anónima o autenticada del cliente final','Estado del carrito de compra en memoria (sessionStorage)','Preferencias de idioma, filtros y vista activa','Caché local del menú via Service Worker (soporte offline parcial)'],
   consume:['Menú estructurado del Menu Engine (via API Gateway + CDN)','Tema visual compilado del tenant (CDN + Edge Cache)','Token de sesión (Auth Middleware)','Contexto de mesa y zona (QR Code Service via URL params)'],
   entrega:['Pedidos confirmados al Order Engine via API Gateway','Eventos de interacción y navegación al Event Bus','Métricas de sesión (tiempo en menú, productos vistos) al Analytics Engine'],
   modifica:['CDN + Edge Cache — actualiza contenido cacheado al invalidar menú','Menu Engine — propaga cambios de menú en tiempo real','Auth Middleware — gestiona apertura y cierre de sesión'],
   consulta:['Analytics Engine — consulta comportamiento del usuario para reportes','Audit & Compliance — registro de accesos al menú'],
   casos:[
     {t:'Escaneo y visualización',d:'Cliente escanea QR en mesa → URL decodifica tenant_id + table_id → API Gateway resuelve tenant → CDN sirve menú cacheado → cliente navega categorías y productos con tema del restaurante.'},
     {t:'Gestión del carrito y pedido',d:'Cliente selecciona platos con variantes y modificadores → carrito gestionado en memoria → cliente revisa resumen → confirma pedido → payload enviado al Order Engine → número de orden recibido y mostrado.'},
     {t:'Menú offline parcial',d:'Cliente con señal intermitente → Service Worker detecta falla de red → sirve versión cacheada del menú → cliente puede navegar sin interrupción → pedido enviado al recuperar conexión.'}
   ],
   flujo:['QR escaneado → URL con tenant_id + table_id decodificada','API Gateway recibe request → Auth Middleware emite sesión','CDN Edge verifica caché del menú del tenant → HIT: respuesta directa / MISS: fetch a Menu Engine','Tema visual del tenant cargado desde CDN Edge','Interfaz renderizada → cliente navega y añade al carrito','Cliente confirma pedido → payload enviado al Order Engine','Order Engine valida y confirma → número de pedido devuelto al cliente','Eventos de sesión publicados al Event Bus → Analytics Engine los consume']},

  {id:'tenant-portal',name:'Admin Portal',sub:'Tenant Dashboard',layer:'presentation',
   objetivo:'Centro de control operacional para el propietario o administrador del restaurante, permitiendo gestionar menú, pedidos en tiempo real, analíticas, usuarios del equipo y configuración del negocio.',
   funcion:'CRUD completo del menú, gestión de pedidos activos con actualización de estado, visualización de reportes analíticos, administración de usuarios del tenant y configuración de branding y notificaciones.',
   administra:['Configuración del panel del operador (filtros activos, vistas preferidas)','Sesión autenticada del tenant admin o editor'],
   consume:['Menú activo con estructura completa (Menu Engine)','Pedidos activos en tiempo real via WebSocket (Order Engine)','Reportes y métricas (Analytics Engine)','Usuarios del tenant (IAM Service)','Configuración del negocio y plan activo (Tenant Orchestrator)','Assets multimedia (Media Manager)'],
   entrega:['Cambios de menú (crear/editar/eliminar productos) al Menu Engine','Actualizaciones de estado de pedidos al Order Engine','Configuraciones del tenant al Tenant Orchestrator','Archivos de imagen al Media Manager'],
   modifica:['Auth Middleware — controla sesión y permisos por rol','Tenant Orchestrator — limita funciones disponibles según plan del tenant'],
   consulta:['Analytics Engine — actividad del operador para reportes','Audit & Compliance — registro de todas las acciones administrativas'],
   casos:[
     {t:'Gestión de menú',d:'Admin agrega nuevo producto con foto, precio, variantes de tamaño y alérgenos → Menu Engine persiste → CDN invalida caché → menú del cliente refleja cambio en menos de 10 segundos.'},
     {t:'Gestión de pedidos en tiempo real',d:'Pedido nuevo llega via WebSocket → Admin Portal lo muestra en lista de activos → operador marca estado "En preparación" → Order Engine actualiza → cliente recibe notificación.'},
     {t:'Configuración de branding',d:'Admin actualiza logo y colores del negocio → White-label Engine compila nuevo tema → CDN Edge lo distribuye → todas las interfaces del tenant reflejan el nuevo branding.'}
   ],
   flujo:['Admin autenticado → JWT con claims de rol tenant_admin emitido','Tenant Orchestrator entrega contexto: plan, límites, sucursales activas','Panel carga menú activo, pedidos en curso y métricas resumen','Acción del admin → validación de permisos en Auth Middleware → módulo correspondiente recibe el comando','Cambio persistido en Tenant Database → evento al Event Bus','Módulos afectados actualizan estado (CDN invalida, Analytics registra)','Auditoría registrada en Audit & Compliance con actor, acción y timestamp']},

  {id:'branch-app',name:'Branch Manager',sub:'Gestor de Sucursal',layer:'presentation',
   objetivo:'Interfaz operacional acotada al scope de una sucursal específica, para que gestores locales administren disponibilidad de productos, pedidos y horarios sin acceso a datos de otras sucursales.',
   funcion:'Gestión de disponibilidad local de productos (overrides por sucursal), vista de pedidos filtrados por sucursal, configuración de horarios locales y alertas operacionales de la unidad.',
   administra:['Estado de disponibilidad de productos en la sucursal activa','Configuración de horarios y turnos de la sucursal','Pedidos activos de la sucursal filtrados por branch_id'],
   consume:['Menú base del tenant con overrides de sucursal (Menu Engine)','Pedidos filtrados por branch_id (Order Engine)','Usuarios asignados a la sucursal (IAM Service)','Configuración de la sucursal (Tenant Orchestrator)'],
   entrega:['Overrides de disponibilidad de productos al Menu Engine (scope: sucursal)','Actualizaciones de estado de pedidos al Order Engine','Eventos de operación de sucursal al Event Bus → Analytics Engine'],
   modifica:['Tenant Orchestrator — define qué funciones tiene habilitadas la sucursal','Auth Middleware — permisos acotados al branch_id específico'],
   consulta:['Analytics Engine — métricas de rendimiento por sucursal','Monitoring — alertas operacionales de la sucursal'],
   casos:[
     {t:'Override de disponibilidad',d:'Chef indica que el salmón se agotó en esta sucursal → Branch Manager marca el producto como no disponible (override local) → Menu Viewer en esa URL/QR oculta el producto sin afectar otras sucursales.'},
     {t:'Gestión de pedidos local',d:'Mesero ve lista de pedidos activos de la sucursal → marca pedido #42 como entregado → Order Engine actualiza → Analytics registra tiempo de entrega de la sucursal.'},
     {t:'Horario especial',d:'Gestor configura menú de desayuno activo solo hasta las 11am los fines de semana en esta sucursal → Menu Engine aplica la regla con contexto de branch_id.'}
   ],
   flujo:['Login con JWT que incluye claim branch_id específico (scope limitado)','Tenant Orchestrator entrega configuración de la sucursal','Menu Engine filtra árbol con overrides aplicados para esta sucursal','Gestor realiza acción → Auth Middleware valida que el branch_id del JWT coincide con el recurso','Cambio enviado al módulo correspondiente con branch_id en el payload','Evento publicado al Event Bus → Analytics Engine procesa métricas por sucursal','Cambio no afecta otras sucursales del mismo tenant']},

  {id:'superadmin',name:'SuperAdmin Console',sub:'Plataforma SaaS',layer:'presentation',
   objetivo:'Dashboard global de administración de toda la plataforma SaaS multi-tenant, para el equipo operador del SaaS (propietario de la plataforma).',
   funcion:'Gestión del ciclo de vida completo de todos los tenants, monitoreo de salud de la plataforma, administración de planes y facturación global, configuración de límites del sistema y acceso a auditoría.',
   administra:['Vista consolidada de todos los tenants y su estado','Configuración global del sistema (plans, features flags, límites)','Alertas operacionales del SaaS'],
   consume:['Datos de todos los tenants (Tenant Orchestrator)','Métricas de salud del sistema (Monitoring & Alerting)','Reportes financieros (Billing & Plans)','Logs de auditoría (Audit & Compliance)','Uso de recursos del sistema (Analytics Engine)'],
   entrega:['Configuraciones de tenant al Tenant Orchestrator','Ajustes de plan al Billing & Plans','Políticas globales a Config & Secrets'],
   modifica:['Solo usuarios con rol superadmin autenticados con MFA pueden modificar la consola y sus configuraciones'],
   consulta:['Monitoring & Alerting — salud de la plataforma','Audit & Compliance — investigación de incidentes globales','Todos los módulos — para intervención administrativa'],
   casos:[
     {t:'Onboarding de nuevo tenant',d:'Nueva pizzería se registra → SuperAdmin verifica y aprueba → Tenant Orchestrator crea contexto completo → IAM Service inicializa rol admin → credenciales enviadas al nuevo tenant admin.'},
     {t:'Suspensión por impago',d:'Billing detecta impago persistente → SuperAdmin revisa historial → confirma suspensión → Tenant Orchestrator marca tenant como suspended → todas sus interfaces muestran aviso → datos preservados 30 días.'},
     {t:'Monitoreo de plataforma',d:'SuperAdmin ve dashboard con: uptime de módulos, latencia de API, tenants activos, MRR del SaaS, top tenants por uso y alertas abiertas en tiempo real.'}
   ],
   flujo:['SuperAdmin autenticado con MFA → JWT con rol superadmin de máximo privilegio','Vista global carga: resumen de tenants, salud del sistema, métricas financieras','Acción de gestión → módulo destino recibe comando con contexto de superadmin','Cambio auditado automáticamente en Audit & Compliance con justificación','Monitoring & Alerting recibe evento de cambio de configuración global']},

  {id:'partner-sdk',name:'Partner API / SDK',sub:'Integraciones externas',layer:'presentation',
   objetivo:'Superficie de integración pública y documentada para que terceros (apps de delivery, POS, ERPs) conecten sus sistemas con la plataforma de menús digitales.',
   funcion:'Expone endpoints de lectura de menú, webhooks de pedidos y configuración de integraciones via API keys autenticadas, con rate limiting y sandboxing por tenant.',
   administra:['API keys de partners por tenant','Webhooks configurados y sus endpoints destino','Logs de uso de API por partner','Configuración de sandboxing y entorno de testing'],
   consume:['Menú del tenant (Menu Engine via API Gateway)','Autenticación de API key (Auth Middleware)','Eventos de pedidos para webhooks (Event Bus)','Configuración de integraciones (Integration Hub)'],
   entrega:['Datos de menú a sistemas externos en formato JSON documentado','Eventos de pedidos via webhooks a sistemas del partner','Métricas de uso de API al Analytics Engine'],
   modifica:['Tenant Admin — configura sus propias API keys e integraciones','SuperAdmin Console — gestiona API keys globales y conectores','Integration Hub — orquesta la conectividad bidireccional'],
   consulta:['Audit & Compliance — uso de API y accesos','Analytics Engine — tráfico y uso por partner'],
   casos:[
     {t:'Integración con delivery',d:'App de delivery consulta el menú del restaurante via GET /v1/menu/{tenant} cada 10 minutos → sincroniza precios y disponibilidad automáticamente.'},
     {t:'POS conectado',d:'Sistema POS envía pedidos directamente via POST /v1/orders con API key → Order Engine los procesa igual que pedidos del Menu Viewer → confirmación retornada al POS.'},
     {t:'Webhook de pedido',d:'Pedido completado en la plataforma → Partner SDK dispara webhook al ERP del restaurante con payload del pedido → ERP confirma recepción → evento registrado en Audit.'}
   ],
   flujo:['Sistema externo llama a API Gateway con API key en header Authorization','Auth Middleware valida la API key → identifica tenant + partner + permisos','Rate Limiter en CDN Edge verifica cuota del partner (requests/min)','Request enrutado al módulo destino (Menu Engine, Order Engine)','Respuesta retornada al sistema externo con datos del tenant aislados','Evento de uso registrado en Analytics y Audit & Compliance']},

  // ── GATEWAY ────────────────────────────────────────────────────────────────
  {id:'api-gateway',name:'API Gateway',sub:'Load Balancer + Router',layer:'gateway',
   objetivo:'Punto de entrada único y orquestador de todo el tráfico dinámico entrante al sistema, garantizando enrutamiento correcto, seguridad centralizada y observabilidad de cada request.',
   funcion:'Enruta peticiones HTTP/S a módulos destino, aplica rate limiting por tenant/IP, transforma payloads según versión de API, gestiona circuit breakers y centraliza el logging de accesos.',
   administra:['Tabla de rutas por endpoint, versión y método HTTP','Reglas de rate limiting por tenant, IP y endpoint','Configuración de circuit breakers por módulo destino','Políticas de CORS y headers de seguridad'],
   consume:['Tokens JWT o API keys de los requests (Auth Middleware)','Reglas de enrutamiento configuradas','Respuestas de módulos core y business','Métricas de latencia y error rate de backends'],
   entrega:['Requests enrutados a módulos internos con headers enriquecidos (tenant_id, trace_id)','Respuestas transformadas a clientes con headers apropiados','Logs de acceso con trace_id al Monitoring & Alerting','Métricas de latencia y throughput al Monitoring'],
   modifica:['Solo CI/CD Pipeline puede modificar la configuración del Gateway via despliegues controlados'],
   consulta:['Todos los módulos de presentación y Partner SDK consumen a través del Gateway','Cache Layer — para rate limiting distribuido'],
   casos:[
     {t:'Enrutamiento de menú',d:'GET /v1/menu/{tenant_id} → Gateway valida JWT con Auth Middleware → aplica rate limit → enruta a Menu Engine → respuesta retornada al cliente con headers de caché.'},
     {t:'Rate limiting',d:'Tenant alcanza límite de 1000 req/min → Gateway detecta → devuelve HTTP 429 con Retry-After header → protege backends de sobrecarga → evento registrado en Monitoring.'},
     {t:'Circuit breaker',d:'Order Engine responde con latencia > 5s repetidamente → Circuit breaker se abre → Gateway devuelve respuesta degradada → Monitoring alerta al equipo de infra.'}
   ],
   flujo:['Request HTTP/S entrante (tráfico dinámico, el estático ya fue filtrado por CDN)','Auth Middleware verifica JWT o API key → contexto de seguridad retornado','Rate Limiter consulta Cache Layer → verifica cuota del tenant/IP','Circuit breaker verifica health del módulo destino','Request forwarded con headers enriquecidos: tenant_id, user_id, trace_id, timestamp','Respuesta recibida del módulo → transformada según versión de API (v1, v2)','Respuesta retornada al cliente con headers HTTP correctos','Log de acceso emitido al Monitoring (latencia, status, trace_id, tenant_id)']},

  {id:'cdn-edge',name:'CDN + Edge Cache',sub:'Cloudflare / AWS CloudFront',layer:'gateway',
   objetivo:'Distribuir contenido estático y dinámico cacheado en nodos de borde de red globales, minimizando latencia para clientes en cualquier geografía y reduciendo carga en los backends de origen.',
   funcion:'Cachea menús, imágenes, assets y respuestas de API frecuentes; gestiona TTL por tipo de recurso; invalida entradas de caché ante actualizaciones; protege el origen contra ataques DDoS con WAF integrado.',
   administra:['Reglas de caché por path, tenant y tipo de recurso','TTL por recurso (menús: 30s, imágenes: 24h, assets estáticos: 7d)','Keys de invalidación por tenant/recurso','Certificados TLS y renovación automática','Reglas WAF para protección contra ataques'],
   consume:['Archivos de Object Storage para assets estáticos','Respuestas dinámicas del API Gateway (para caché de API)','Señales de invalidación del Event Bus via workers de borde','Políticas de caché configuradas en Config & Secrets'],
   entrega:['Respuestas cacheadas a clientes finales en <50ms desde nodo más cercano','Requests de cache-miss forwarded al API Gateway','Métricas de hit-rate, latencia y tráfico al Monitoring','Protección DDoS absorbida en el borde sin impacto a los backends'],
   modifica:['Menu Engine — publica evento de menú actualizado → CDN invalida caché del tenant','Media Manager — invalida assets al actualizar imágenes','CI/CD Pipeline — purga total de caché en despliegues mayores'],
   consulta:['Menu Viewer, QR Code Service, Partner SDK — contenido de menús e imágenes','Admin Portal — assets de dashboard e interfaz'],
   casos:[
     {t:'Alta concurrencia',d:'1000 clientes abren el menú simultáneamente → CDN Edge sirve desde caché distribuida → 0 requests llegan al Menu Engine → latencia < 50ms para todos los clientes.'},
     {t:'Invalidación de caché',d:'Chef desactiva un plato en Admin Portal → Menu Engine publica evento → worker del CDN recibe señal de invalidación → siguiente request del cliente trae dato actualizado desde Menu Engine.'},
     {t:'Protección ante ataque',d:'Ataque volumétrico DDoS a la plataforma → WAF del CDN absorbe el tráfico malicioso en el borde → backends protegidos → servicio ininterrumpido para clientes legítimos.'}
   ],
   flujo:['Request HTTP llega al nodo edge geográficamente más cercano al cliente','Verificar cache key (hash de tenant_id + path + query params relevantes)','HIT: devolver respuesta cacheada con headers Cache-Control → fin del flujo','MISS: forward request al API Gateway en región de origen','Respuesta recibida → evaluar si es cacheable (según headers y reglas)','Almacenar en caché con TTL apropiado al tipo de recurso','Devolver respuesta al cliente','Event Bus suscripción: worker de borde escucha eventos de invalidación por tenant/recurso']},

  {id:'auth-middleware',name:'Auth Middleware',sub:'JWT + API Keys',layer:'gateway',
   objetivo:'Validar y autorizar cada petición entrante al sistema, garantizando que solo identidades legítimas con los permisos correctos accedan a cada recurso del tenant correcto.',
   funcion:'Verifica tokens JWT, valida API keys de partners, evalúa permisos RBAC del usuario según su rol y tenant, y emite contexto de seguridad enriquecido a todos los módulos del sistema.',
   administra:['Claves de verificación JWT (rotadas via Config & Secrets)','Blacklist de tokens revocados en Cache Layer','Reglas RBAC por rol y recurso','Estado de sesiones activas por usuario'],
   consume:['JWT o API key del header Authorization de cada request','Clave pública de verificación JWT (Config & Secrets)','Árbol de roles y permisos del usuario (IAM Service)','Blacklist de tokens revocados (Cache Layer)'],
   entrega:['Contexto de autenticación enriquecido: user_id, tenant_id, branch_id, roles, permisos — a todos los módulos','Eventos de login/logout/token-revocado al Event Bus','Logs de autenticación (éxito y fallo) al Monitoring & Alerting y Audit & Compliance'],
   modifica:['IAM Service — actualiza árbol de roles y permisos en tiempo real','Config & Secrets — rota claves de firma JWT con soporte de transición'],
   consulta:['API Gateway — validación de cada request antes de enrutar','Todos los módulos que requieren verificación de identidad antes de ejecutar una acción'],
   casos:[
     {t:'Login y emisión de JWT',d:'Tenant Admin envía credenciales → Auth Middleware valida hash → consulta IAM Service → emite JWT signed con claims de tenant_id, roles y permisos → Admin Portal accede a recursos del tenant.'},
     {t:'Token expirado y refresh',d:'Cliente presenta JWT expirado → Auth Middleware devuelve 401 con indicación → cliente usa refresh token → nuevo JWT emitido sin requerir nueva contraseña → sesión transparente para el usuario.'},
     {t:'Acceso cross-tenant bloqueado',d:'Tenant B intenta acceder a datos del Tenant A modificando el tenant_id en el request → Auth Middleware detecta mismatch entre JWT claim y recurso solicitado → request rechazado con 403 → evento de anomalía registrado en Audit.'}
   ],
   flujo:['Request recibido con header Authorization (Bearer JWT o Api-Key)','Extraer token → verificar firma criptográfica con clave pública (Config & Secrets)','Verificar campos estándar: exp (expiración), iss (emisor), aud (audiencia)','Verificar que el token no esté en blacklist (Cache Layer)','Consultar IAM Service para permisos actualizados del usuario','Evaluar permisos RBAC contra el recurso y acción solicitada','Enriquecer request con contexto de seguridad (tenant_id, user_id, roles, branch_id)','Autorizar (forward al módulo destino) o rechazar (403/401) el acceso','Log de resultado emitido al Monitoring y Audit & Compliance']},

  // ── CORE ──────────────────────────────────────────────────────────────────

  {id:'menu-service',name:'Menu Engine',sub:'Core Business Logic',layer:'core',

   modifica:['Event Bus — publica señales de invalidación cuando un dato fuente cambia','Tenant Database — fuente de datos al producirse un cache-miss','Auth Middleware — gestiona blacklist de tokens revocados'],

   casos:[

function buildSidebar() {
  const sb = document.getElementById('sb');
  const layerOrder = ['presentation','gateway','core','business','data','infra'];
  layerOrder.forEach(lk => {
    const l = LAYERS[lk];
    const mods = MODS.filter(m => m.layer === lk);
    const group = document.createElement('div');
    group.className = 'layer-group';
    group.innerHTML = `<div class="layer-header">
      <span class="layer-dot" style="background:${l.hex}"></span>
      <span style="color:${l.hex}">${l.label}</span>
    </div>`;
    mods.forEach(m => {
      const item = document.createElement('div');
      item.className = 'mod-item';
      item.dataset.id = m.id;
      item.innerHTML = `<span class="mi-name">${m.name}</span><span class="mi-sub">${m.sub}</span>`;
      item.addEventListener('click', () => selectMod(m.id));
      group.appendChild(item);
    });
    sb.appendChild(group);
  });
}

function selectMod(id) {
  const m = MODS.find(x => x.id === id);
  if (!m) return;
  document.querySelectorAll('.mod-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector(`.mod-item[data-id="${id}"]`);
  if (item) { item.classList.add('active'); item.scrollIntoView({block:'nearest'}); }
  const l = LAYERS[m.layer];
  document.getElementById('welcome').classList.remove('show');
  document.getElementById('empty').classList.remove('show');
  const mv = document.getElementById('mod-view');
  mv.style.display = 'block';

  document.getElementById('mod-header').innerHTML = `
    <div class="mod-breadcrumb">
      <span class="bc-layer" style="background:${l.hex}22;color:${l.hex}">${l.label}</span>
      <span>›</span><span>${m.name}</span>
    </div>
    <div class="mod-title">${m.name}</div>
    <div class="mod-sub-label"><span>${m.sub}</span><span class="mod-id">/ ${m.id}</span></div>`;

  const body = document.getElementById('mod-body');
  body.innerHTML = `
    <div class="sec-grid">
      ${sec('Objetivo',m.objetivo,'text')}
      ${sec('Función',m.funcion,'text')}
    </div>
    <div class="sec-grid">
      ${sec('Datos que administra',m.administra,'list')}
      ${sec('Datos que consume',m.consume,'list')}
    </div>
    <div class="sec-grid">
      ${sec('Datos que entrega',m.entrega,'list')}
      <div class="sec-grid" style="grid-column:auto;display:block">
        ${sec('Módulos que pueden modificarlo',m.modifica,'tags')}
        <div style="height:12px"></div>
        ${sec('Módulos que pueden consultarlo',m.consulta,'tags')}
      </div>
    </div>
    <div class="sec-full">${sec('Casos de uso',m.casos,'cases')}</div>
    <div class="sec-full">${sec('Flujo interno',m.flujo,'flow')}</div>`;

  body.querySelectorAll('.tag.mod-ref').forEach(tag => {
    tag.addEventListener('click', () => {
      const found = MODS.find(x => tag.textContent.toLowerCase().includes(x.name.toLowerCase().split(' ')[0]));
      if (found) selectMod(found.id);
    });
  });

  document.getElementById('main').scrollTop = 0;
  location.hash = id;
}

function sec(label, data, type) {
  let content = '';
  if (type === 'text') {
    content = `<p class="sec-text">${data}</p>`;
  } else if (type === 'list') {
    content = `<ul class="item-list">${data.map(d=>`<li>${d}</li>`).join('')}</ul>`;
  } else if (type === 'tags') {
    content = `<div class="tag-list">${data.map(d=>`<span class="tag mod-ref">${d}</span>`).join('')}</div>`;
  } else if (type === 'cases') {
    content = `<div class="uc-list">${data.map((c,i)=>`<div class="uc"><div class="uc-title"><span class="uc-num">${i+1}</span>${c.t}</div><div class="uc-desc">${c.d}</div></div>`).join('')}</div>`;
  } else if (type === 'flow') {
    content = `<div class="flow-list">${data.map((s,i)=>`<div class="flow-step"><div class="flow-num">${String(i+1).padStart(2,'0')}</div><div class="flow-content">${s}</div></div>`).join('')}</div>`;
  }
  return `<div class="sec"><div class="sec-label">${label}</div>${content}</div>`;
}

// SEARCH
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll('.mod-item').forEach(el => {
    const name = el.querySelector('.mi-name').textContent.toLowerCase();
    const sub = el.querySelector('.mi-sub').textContent.toLowerCase();
    const show = !q || name.includes(q) || sub.includes(q);
    el.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  document.getElementById('mod-count').textContent = visible;
  const empty = visible === 0 && !document.getElementById('welcome').classList.contains('show');
  document.getElementById('empty').classList.toggle('show', visible === 0);
});

buildSidebar();
if (location.hash) {
  const id = location.hash.slice(1);
  if (MODS.find(m => m.id === id)) selectMod(id);
}
</script>
</body>
